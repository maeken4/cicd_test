name: Hello
on: push
jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            # リテラルブロック。改行を維持したまま一つの文字列としてrunに渡す。各行がそのまま実行される。
            - run: |
                echo "hello, world"
                tree | cat
                ls
            - uses: actions/checkout@v7
              with: # どのブランチをチェックアウトするか。省略したら、コミットされたbranchになる。
                ref: main
            - run: |
                ls
                whoami
                tree
                python --version
            - uses: actions/checkout@v7
            - run: >
                ls
            - uses: actions/setup-python@v7
              with:
                python-version: "3.15"
            - run: |
                python --version
                python main.py
    goodby:
        runs-on: ubuntu-latest
        steps:
            # jobが分かれているので、この段階ではcheckoutされておらず
            # main.pyとかもなくてエラーになる
            - run: |
                python --version
                python main.py
                python --version
